services:
  postgres:
    image: postgres:16-alpine
    container_name: retrysafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retrysafe
      POSTGRES_PASSWORD: retrysafe
      POSTGRES_DB: retrysafe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrysafe -d retrysafe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
